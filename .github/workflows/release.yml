---
name: Molecule Tests Workflow
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  merge_group:
  schedule:
    - cron: "15 0 * * *" # From GitHub, events may be delayed at the hour, adviseable to run at specific time after the hour
  workflow_dispatch:

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: "ubuntu-latest"

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible Core and Ansible Lint
        run: |
          pip3 install -r .github/workflows/requirements/requirements_ansible_lint.txt

      - name: Install Ansible Core collection dependencies
        run: |
          ansible-galaxy collection install -r .github/workflows/requirements/requirements_collections.yml

      - name: Run Ansible Lint
        run: |
          ansible-lint --force-color

  molecule:
      name: Molecule Tests
      runs-on: "ubuntu-latest"
      needs: ansible-lint

      steps:
        - name: Check out the codebase
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.13"

        - name: Install Ansible Core and Molecule
          run: |
            pip3 install -r .github/workflows/requirements/requirements_molecule.txt

        - name: Install Ansible Core collection dependencies
          run: |
            ansible-galaxy collection install -r .github/workflows/requirements/requirements_collections.yml

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Run Molecule tests
          env:
            PY_COLORS: 1
            ANSIBLE_FORCE_COLOR: 1
          run: |
            molecule test
...
