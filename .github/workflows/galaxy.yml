---
name: Ansible Galaxy Role Import
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

jobs:
  ansible-galaxy:
    name: Import role to Ansible Galaxy
    runs-on: "ubuntu-latest"

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible Core
        run: |
          pip3 install -r .github/workflows/requirements/requirements_ansible_galaxy.txt

      - name: Import role releases to Ansible Galaxy
        run: >
          ansible-galaxy role import --api-key ${{ secrets.GALAXY_API_KEY }} $(echo ${{ github.repository }} | cut -d/ -f1) $(echo ${{ github.repository }} | cut -d/ -f2)
...
