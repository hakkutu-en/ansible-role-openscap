---
- name: Ensure that {{ tmp_directory }} directory exists
  ansible.builtin.file:
    path: "{{ tmp_directory }}"
    state: "directory"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "{{ directory_mode }}"

- name: Ensure that Scap Security Guide package is installed
  when:
    - ansible_facts['distribution'] == "RedHat"
  ansible.builtin.package:
    name: "{{ scap_package_name[ansible_facts['os_family']] }}"
    state: "latest"
    update_cache: true
    lock_timeout: 300

- name: Ensure that Scap Security content is made available to managed node
  when:
    - not (ansible_facts['distribution'] == "RedHat")
  block:
    - name: Ensure that Scap Security Guide content is downloaded
      ansible.builtin.get_url:
        url: "{{ scap_content_url }}"
        dest: "{{ tmp_directory }}/{{ scap_content_file }}"
        owner: "{{ file_owner }}"
        group: "{{ file_group }}"
        mode: "{{ file_mode }}"

    - name: Ensure that Scap Security Guide content is extracted
      ansible.builtin.unarchive:
        src: "{{ tmp_directory }}/{{ scap_content_file }}"
        dest: "{{ tmp_directory }}/"
        remote_src: true
        extra_opts: [-q]

- name: Ensure that Ansible configuration file is copied
  ansible.builtin.copy:
    src: "ansible.cfg"
    dest: "{{ tmp_directory }}/ansible.cfg"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "{{ file_mode }}"

- name: Ensure that Ansible collection requirements file is copied
  ansible.builtin.copy:
    src: "requirements/{{ ansible_facts['distribution'] }}_{{ ansible_facts['distribution_major_version'] }}.yml"
    dest: "{{ tmp_directory }}/collections_requirements.yml"
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"
    mode: "{{ file_mode }}"

- name: Ensure that ansible-core is installed in the virtual environment
  ansible.builtin.pip:
    name: "ansible-core"
    state: "latest"
    virtualenv: "{{ tmp_directory }}/openscap"
    virtualenv_command: "python3 -m venv"

- name: Ensure that the needed Ansible collections are installed
  ansible.builtin.shell:
    chdir: "{{ tmp_directory }}"
    cmd: |
      . openscap/bin/activate
      ansible-galaxy collection install -r collections_requirements.yml

- name: Ensure that the scap playbook is executed
  register: playbook_run_output
  ansible.builtin.shell:
    chdir: "{{ tmp_directory }}"
    cmd: |
      . openscap/bin/activate
      ansible-playbook -i localhost, -c local {{ scap_execution_parameters[ansible_facts['distribution']]['content_base_directory'] }}/{{ scap_execution_parameters[ansible_facts['distribution']]['playbook_name'][ansible_facts['distribution_major_version']] }}

- name: Display the output of the remediation script
  ansible.builtin.debug:
    var: playbook_run_output

- name: Ensure that housekeeping is completed
  block:
    - name: Ensure that Scap Security package is removed
      when:
        - ansible_facts['distribution'] == "RedHat"
      ansible.builtin.package:
        name: "{{ scap_package_name[ansible_facts['os_family']] }}"
        state: "absent"
        update_cache: true
        lock_timeout: 300

    - name: Ensure that Scap Security content is removed
      when:
        - not (ansible_facts['distribution'] == "RedHat")
      ansible.builtin.file:
        path: "{{ tmp_directory }}"
        state: "absent"
...