---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Ensure that unzip is installed
      ansible.builtin.package:
        name: "unzip"
        state: "present"
        update_cache: true
        lock_timeout: 300

    - name: Ensure that python3-venv is installed for Ubuntu distribution
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
      ansible.builtin.package:
        name: "python3-venv"
        state: present
        update_cache: true
        lock_timeout: 300
...