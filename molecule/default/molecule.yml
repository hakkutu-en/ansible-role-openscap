---
driver:
  name: default
platforms:
  # Issues with the AMI used
  # Will implement tests late
  # - name: "afs1-hakkutu-dev-ansible-role-openscap-rhel-8"
  #   image_id: "ami-025118c9cf7ae365b"
  #   instance_type: "t3.medium"
  #   ebs_device_name: "/dev/sda1"
  #   ebs_volume_size: 30
  #   ssh_username: "ec2-user"

  - name: "afs1-hakkutu-dev-ansible-role-openscap-rhel-9"
    image_id: "ami-0d117e94e5cb4d9a8"
    instance_type: "t3.medium"
    ebs_device_name: "/dev/sda1"
    ebs_volume_size: 30
    ssh_username: "ec2-user"

  - name: "afs1-hakkutu-dev-ansible-role-openscap-amazon-linux-2023"
    image_id: "ami-080b2e8ce472c5091"
    instance_type: "t3.medium"
    ebs_device_name: "/dev/xvda"
    ebs_volume_size: 30
    ssh_username: "ec2-user"

  - name: "afs1-hakkutu-dev-ansible-role-openscap-ubuntu-22"
    image_id: "ami-09cfcf94626d1774c"
    instance_type: "t3.medium"
    ebs_device_name: "/dev/sda1"
    ebs_volume_size: 30
    ssh_username: "ubuntu"

  - name: "afs1-hakkutu-dev-ansible-role-openscap-ubuntu-24"
    image_id: "ami-0df2e3e0c3482e492"
    instance_type: "t3.medium"
    ebs_device_name: "/dev/sda1"
    ebs_volume_size: 30
    ssh_username: "ubuntu"
provisioner:
  name: "ansible"
  ansible_args:
    - "--skip-tags sudo_require_authentication"
  config_options:
    defaults:
      callbacks_enabled: "ansible.posix.profile_tasks, ansible.posix.timer"
  playbooks:
    create: "create.yml"
    prepare: "prepare.yml"
    converge: "converge.yml"
    verify: "verify.yml"
    destroy: "destroy.yml"
  env:
    ANSIBLE_ROLES_PATH: "~/.ansible/roles"
...
